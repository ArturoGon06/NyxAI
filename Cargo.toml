[package]
name = "nyxai"
version = "1.4.0"
edition = "2021"
rust-version = "1.82"
description = "A self-hosted, mobile-first interface for local AI characters"
license = "MIT"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "multipart"] }
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "io-util", "sync"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.12", features = ["v4"] }
